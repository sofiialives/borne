services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: borne
      POSTGRES_PASSWORD: borne
      POSTGRES_DB: borne_crm
    ports:
      - "5433:5432"
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borne -d borne_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://borne:borne@postgres:5432/borne_crm
      PORT: 4000
      JWT_SECRET: change-moi-en-production
    ports:
      - "4000:4000"

  kiosk-server:
    build:
      context: .
      dockerfile: kiosk-server/Dockerfile
    restart: unless-stopped
    environment:
      KIOSK_BORNE_ID: ${KIOSK_BORNE_ID:-11111111-1111-4111-8111-111111111111}
      KIOSK_BACKEND_URL: http://backend:4000
      KIOSK_SYNC_INTERVAL_MS: 5000
      KIOSK_LOCAL_PORT: 4100
    volumes:
      - donnees_kiosk:/app/data
    ports:
      - "4100:4100"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_KIOSK_URL: http://localhost:4100
    restart: unless-stopped
    depends_on:
      - backend
      - kiosk-server
    ports:
      - "5173:80"

volumes:
  donnees_postgres:
  donnees_kiosk:
